# Tüm sistem: docker compose up -d --build
# Bellek sınırları 16 GB RAM'li bir dizüstü için ayarlandı (toplam üst sınır ~5 GB).

x-app: &app
  env_file: .env
  restart: "no"

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]          # bilgisayarınızdaki scriptler için: localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 15s

  kafka-init:                         # topic'leri bir kez oluşturur ve çıkar
    image: apache/kafka:3.8.0
    env_file: .env
    environment:
      KAFKA_HEAP_OPTS: "-Xmx128m"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in $$TOPIC_RAW $$TOPIC_METRICS $$TOPIC_COMMANDS $$TOPIC_APPLIED; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1 || exit 1
        done
        echo "topics ready"
    mem_limit: 256m

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    env_file: .env
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["${CLICKHOUSE_HTTP_PORT:-8123}:8123"]              # http://localhost:8123/play
    volumes:
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark:
    <<: *app
    build: ./services/spark
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 768m
      - --conf
      - spark.ui.enabled=false
      - /app/metrics_job.py
    mem_limit: 1536m
    restart: unless-stopped

  decision-service:
    <<: *app
    build: ./services/decision
    volumes:
      - ./config:/config:ro
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    mem_limit: 256m
    restart: unless-stopped

  sumo-bridge:                        # bir koşu yapar ve çıkar (deneyler: scripts/run_experiments.py)
    <<: *app
    build: ./services/sumo_bridge
    volumes:
      - ./sumo:/sumo
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./results:/results
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      spark: { condition: service_started }
      decision-service: { condition: service_started }
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.2.0
    env_file: .env
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/traffic.json
    ports: ["${GRAFANA_PORT:-3000}:3000"]              # http://localhost:3000
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      clickhouse: { condition: service_healthy }
    mem_limit: 384m

volumes:
  ch-data:
  grafana-data:
